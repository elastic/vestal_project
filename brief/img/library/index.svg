<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" role="img" aria-label="Elasticsearch index">
  <!-- cylinder body -->
  <rect x="10" y="20" width="80" height="80" fill="#FFFFFF" stroke="#101C3F" stroke-width="2"/>
  <!-- bottom ellipse -->
  <ellipse cx="50" cy="100" rx="40" ry="10" fill="#FFFFFF" stroke="#101C3F" stroke-width="2"/>
  <!-- top ellipse band (Elastic Blue) -->
  <ellipse cx="50" cy="20" rx="40" ry="10" fill="#0B64DD" stroke="#101C3F" stroke-width="2"/>
  <!-- label -->
  <text x="50" y="65" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" font-weight="600" fill="#101C3F">ES Index</text>
</svg>
