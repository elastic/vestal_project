<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-label="Two-by-two decision grid template">
  <!-- Column headers -->
  <rect x="100" y="4" width="130" height="36" rx="4" fill="#153385"/>
  <text x="165" y="27" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" font-weight="600" fill="#FFFFFF">Option A</text>
  <rect x="236" y="4" width="140" height="36" rx="4" fill="#153385"/>
  <text x="306" y="27" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" font-weight="600" fill="#FFFFFF">Option B</text>

  <!-- Row headers -->
  <rect x="4" y="44" width="92" height="74" rx="4" fill="#F5F7FA" stroke="#101C3F" stroke-width="1.5"/>
  <text x="50" y="85" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" font-weight="600" fill="#101C3F">Condition 1</text>
  <rect x="4" y="124" width="92" height="72" rx="4" fill="#F5F7FA" stroke="#101C3F" stroke-width="1.5"/>
  <text x="50" y="165" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" font-weight="600" fill="#101C3F">Condition 2</text>

  <!-- Top-left cell -->
  <rect x="100" y="44" width="130" height="74" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <!-- Top-right cell -->
  <rect x="236" y="44" width="140" height="74" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <!-- Bottom-left cell -->
  <rect x="100" y="124" width="130" height="72" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <!-- Bottom-right cell (correct — Light Teal accent) -->
  <rect x="236" y="124" width="140" height="72" rx="4" fill="rgba(72,239,207,0.15)" stroke="#48EFCF" stroke-width="2"/>
  <text x="306" y="165" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#101C3F" font-style="italic">&#10003; correct</text>
</svg>
