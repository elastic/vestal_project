<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Three Cortex constraints: data residency, a cost ceiling and a latency ceiling. Each sandbox gets one.">
  <rect width="460" height="260" fill="#F5F7FA" rx="10"/>
  <text x="230" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#101C3F">Three Cortex constraints. Your sandbox gets one.</text>

  <!-- Residency row -->
  <rect x="16" y="44" width="428" height="60" rx="8" fill="#FFFFFF" stroke="#101C3F" stroke-width="1.5"/>
  <rect x="16" y="44" width="7" height="60" rx="3.5" fill="#0B64DD"/>
  <text x="34" y="66" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0B64DD">Data residency</text>
  <text x="34" y="83" font-family="Arial,sans-serif" font-size="11" fill="#343741">Cortex requires EU-hosted inference. The fast tier's provider has no EU region.</text>
  <text x="34" y="98" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#FF957D">&#x2192; A rule: rules out the fast tier</text>

  <!-- Cost ceiling row -->
  <rect x="16" y="116" width="428" height="60" rx="8" fill="#FFFFFF" stroke="#101C3F" stroke-width="1.5"/>
  <rect x="16" y="116" width="7" height="60" rx="3.5" fill="#153385"/>
  <text x="34" y="138" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#153385">Cost ceiling</text>
  <text x="34" y="155" font-family="Arial,sans-serif" font-size="11" fill="#343741">A budget per 1,000 requests. Your measured cost per tier decides.</text>
  <text x="34" y="170" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#FF957D">&#x2192; A measurement: rules out any tier over it</text>

  <!-- Latency ceiling row -->
  <rect x="16" y="188" width="428" height="60" rx="8" fill="#FFFFFF" stroke="#101C3F" stroke-width="1.5"/>
  <rect x="16" y="188" width="7" height="60" rx="3.5" fill="#48EFCF"/>
  <text x="34" y="210" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101C3F">Latency ceiling</text>
  <text x="34" y="227" font-family="Arial,sans-serif" font-size="11" fill="#343741">A median (p50) response time. Your measured latency per tier decides.</text>
  <text x="34" y="242" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#FF957D">&#x2192; A measurement: rules out any tier over it</text>
</svg>
